# ==============================================================================
# HOW TO USE
# ==============================================================================
#
# Prereqs:
#   sudo dnf install ansible
#
# Run everything:
#   ansible-playbook postinstall.yml --ask-become-pass
#
# Run only a subset, using tags:
#   ansible-playbook postinstall.yml --ask-become-pass --tags minimal
#   ansible-playbook postinstall.yml --ask-become-pass --tags cli
#   ansible-playbook postinstall.yml --ask-become-pass --tags desktop
#
#   (tags: "minimal" = bare CLI essentials, "cli" = full CLI/dev toolset,
#    "desktop" = VS Code + GUI extras. Espanso, Hyprland stack, and the
#    Flatpak apps section currently have no tags and always run.)
#
# List tasks/tags without running anything:
#   ansible-playbook postinstall.yml --list-tasks
#   ansible-playbook postinstall.yml --list-tags
#
# Dry run (see what would change, no changes applied):
#   ansible-playbook postinstall.yml --ask-become-pass --check
#
# Notes:
#   - --ask-become-pass is needed since several tasks use `become: true`
#     (sudo). You'll be prompted for your password once at the start.
#   - Safe to re-run: most tasks are idempotent (dnf/pip/flatpak modules,
#     `creates:` guards on install scripts, etc.), so re-running after a
#     partial failure just picks up where it left off.
#   - LM Studio is intentionally left commented out below — there's no
#     stable download URL to script. Grab the AppImage manually from
#     https://lmstudio.ai/download, then uncomment/adjust that task.
#   - config_path below points at this repo; stow reads its `config/`
#     folder to symlink dotfiles into $HOME.
#
# ==============================================================================

- name: Configure Fedora/RHEL machine
  hosts: localhost
  vars:
    config_path: "$HOME/repos/myconfig"

  tasks:

    - name: Enable COPRs (Fedora/RHEL)
      become: true
      command: 'dnf copr enable {{ item }} -y'
      with_items:
        - atim/starship
        - varlad/helix



    - name: Install minimal packages
      become: true
      package:
        name:
          - stow
          - fzf
          - tmux
          - htop
          - docker
          - docker-compose
          - python3-pip
          - git
          - lazygit
          - fish
          - bat
          - helix
          - fontawesome5*
          - fira-code-fonts
        state: present
        update_cache: false
        install_weak_deps: false
      tags:
        - minimal
        - cli



    - name: Install packages
      become: true
      package:
        name:
          - wget
          - curl
          - jq
          - unzip
          - zip
          - just
          - python3
          - python3-pip
          - docker-compose
          - chromium
        state: present
        update_cache: false
        install_weak_deps: false
      tags:
        - cli



    - name: Install starship
      become: true
      package:
        name: starship
        state: present
      tags:
        - cli



    - name: Install lazydocker
      shell: 'curl https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash'
      args:
        creates: "~/.local/bin/lazydocker"
      tags:
        - cli



    - name: Install bun
      shell: 'curl -fsSL https://bun.sh/install | bash'
      args:
        creates: "~/.bun/bin/bun"
      tags:
        - cli



    - name: Install uv
      shell: 'curl -LsSf https://astral.sh/uv/install.sh | sh'
      args:
        creates: "~/.local/bin/uv"
      tags:
        - cli



    - name: Install opencode (via bun)
      shell: '~/.bun/bin/bun install -g opencode-ai'
      tags:
        - cli



    - name: Install Python packages with pip
      pip:
        name:
          - django
          - ruff
          - beautifulsoup4
          - numpy
          - pandas
          - matplotlib
          - requests
          - fastapi
          - scrapy
      tags:
        - cli



    - name: Install Ollama
      shell: 'curl -fsSL https://ollama.com/install.sh | sh'
      tags:
        - cli

    # LM Studio ships on Linux only as an AppImage with no fixed/versioned
    # download URL, so there's nothing reliable to script here the way we
    # do for Espanso below. Grab the current AppImage manually from
    # https://lmstudio.ai/download and drop it in ~/opt, e.g.:
    # - name: Download LM Studio AppImage
    #   get_url:
    #     url: "<latest LM Studio Linux AppImage URL>"
    #     dest: "~/opt/LMStudio.AppImage"
    #     mode: "0755"



    - name: Install Rust via rustup
      become: yes
      shell: 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'
      args:
        creates: "~/.cargo/bin/rustc"
      tags:
        - cli

    - name: Install rust-analyzer, clippy components
      command: "rustup component add {{ item }}"
      with_items:
        - rust-analyzer
        - clippy
      ignore_errors: yes
      tags:
        - cli

    - name: Install bacon and pi-coding-agent via cargo
      shell: '~/.cargo/bin/cargo install {{ item }}'
      with_items:
        - bacon
        - pi-coding-agent
      tags:
        - cli



    - name: Clone config
      git:
        repo: https://github.com/mehdi-yc/postinstall
        dest: "{{ config_path }}"
        force: true
        update: true
      tags:
        - minimal
        - cli



    - name: Backup .bashrc and .Xresources
      command: mv "{{ item }}" "{{ item }}.bak"
      args:
        creates: "{{ item }}.bak"
      with_items:
        - ~/.bashrc
        - ~/.Xresources
      ignore_errors: yes
      tags:
        - minimal
        - cli



    - name: Stow the config files
      command: stow -vRd "{{ config_path }}/" -t $HOME config
      tags:
        - minimal
        - cli



    - name: Ensure Fonts directory exists
      become: true
      file:
        path: /usr/share/fonts/truetype/
        recurse: true
        state: directory
      tags:
        - cli



    - name: Download FiraCode Regular Nerd Font
      become: true
      get_url:
        url: https://github.com/ryanoasis/nerd-fonts/raw/v3.0.2/patched-fonts/FiraCode/Regular/FiraCodeNerdFont-Regular.ttf
        dest: /usr/share/fonts/truetype/FiraCode-Regular.ttf
      tags:
        - cli



    - name: Install Hyprland desktop stack
      become: true
      package:
        name:
          - rofi
          - dunst
          - hyprland
          - waybar
          - swww
        state: present
      tags: minimal



    - name: Add Microsoft repo key (for VS Code)
      become: true
      rpm_key:
        key: https://packages.microsoft.com/keys/microsoft.asc
        state: present
      tags: desktop

    - name: Add VS Code repo
      become: true
      yum_repository:
        name: vscode
        description: Visual Studio Code
        baseurl: https://packages.microsoft.com/yumrepos/vscode
        gpgcheck: true
        gpgkey: https://packages.microsoft.com/keys/microsoft.asc
      tags: desktop

    - name: Install Flatpak and VS Code
      become: true
      package:
        name:
          - flatpak
          - code
        state: present
      tags: desktop



    - name: Install VS Code extensions
      command: code --install-extension "{{ item }}"
      with_items:
        - yandeu.five-server
        - PKief.material-icon-theme
      tags: desktop

#____________________________________________________________
#________________________ESPASO______________________________
    - name: Check if ~/opt directory exists
      ansible.builtin.stat:
        path: "~/opt"
      register: opt_dir

    - name: Create the ~/opt destination folder if it doesn't exist
      ansible.builtin.file:
        path: "~/opt"
        state: directory
      when: not opt_dir.stat.exists

    - name: Download the Espanso AppImage
      ansible.builtin.get_url:
        url: "https://github.com/federico-terzi/espanso/releases/download/v2.1.8/Espanso-X11.AppImage"
        dest: "~/opt/Espanso.AppImage"

    - name: Make Espanso AppImage executable
      ansible.builtin.command:
        cmd: "chmod u+x ~/opt/Espanso.AppImage"

    - name: Register espanso command alias
      ansible.builtin.command:
        cmd: "sudo ~/opt/Espanso.AppImage env-path register"

    - name: Register Espanso service
      ansible.builtin.command:
        cmd: "sudo ~/opt/Espanso.AppImage service register"

    # - name: Start Espanso with --unmanaged option
    #   ansible.builtin.command:
    #     cmd: "~/opt/Espanso.AppImage start --unmanaged"
#____________________________________________________________
#____________________________________________________________

    - name: Ensure Flathub remote is added
      become: true
      flatpak_remote:
        name: flathub
        state: present
        flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo

    - name: Install Flatpak Apps
      become: true
      flatpak:
        name:
          - com.github.tchx84.Flatseal   # manage flatpak permissions
          - org.kde.kdenlive             # video editing
          - org.inkscape.Inkscape        # vector manipulation
          - com.valvesoftware.Steam
          - org.onlyoffice.desktopeditors
          - com.obsproject.Studio        # screen/stream recording
          - io.github.mfat.sshpilot      # SSH connection manager
        method: system
        state: present
