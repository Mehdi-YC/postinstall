# ==============================================================================
# Fedora KDE — bootstrapper equivalent of playbooks/fedora_new.yml
# ==============================================================================
#
#   cd ~/repos/postinstall/bootstrapper
#   ./bootstrapper check  -c ../playbooks/fedora.cfg    # read-only report
#   ./bootstrapper plan   -c ../playbooks/fedora.cfg    # what apply would do
#   ./bootstrapper apply  -c ../playbooks/fedora.cfg --sudo
#   ./bootstrapper apply  -c ../playbooks/fedora.cfg --only packages --sudo
#
# Run it as yourself, never as `sudo ./bootstrapper`. Under root, $HOME is
# /root, so `bun install -g` and `uv tool install` put your tools somewhere your
# PATH never looks. `--sudo` asks for your password once, up front, then
# escalates only the commands that need it.
#
# This file replaces the Ansible playbook for Fedora. Kept parallel to it
# deliberately, so the two are easy to diff:
#
#   playbook task                     here
#   ------------------------------    --------------------------------------
#   dnf copr enable atim/starship     [sources.copr]
#   Terra repo                        [sources.rpm.terra]
#   VS Code key + repo + install      [sources.rpm.vscode] + [packages.dnf]
#   package: name: [...]              [packages.dnf]
#   git clone + stow                  [dotfiles]
#   curl | bash installers            [exec.*], guarded by a `check`
#   bun install -g opencode-ai        [packages.bun]
#   flatpak_remote flathub            [sources.flatpak]
#   flatpak method: system            [packages.flatpak] + sudo = true
#
# Difference worth knowing: the playbook installs flatpaks with
# `method: system`, so they are machine-wide and need root. The builtin
# default is `--user`, so `sudo = true` is set explicitly below to match. If
# you would rather have them per-user, delete those two lines.

# ---- variables --------------------------------------------------------------
#
# `${name}` expands anywhere in this file, including in URLs. Variables may
# reference each other in any order.
#
# A variable named in `secret` has its value withheld from the run log. The
# spelling is the opposite of what it looks like: listing a name here hides it.

[variables]
config_repo = https://github.com/mehdi-yc/postinstall
home = ${HOME}

# ---- privilege --------------------------------------------------------------
#
# Defaults, for reference — each is overridable per section with `sudo =`:
#
#   dnf, sources.copr, sources.rpm    root    rpmdb, /etc/yum.repos.d, /etc/pki
#   cargo, bun, uv                    none    $HOME/.cargo, $HOME/.local
#   flatpak                           none    --user, your own installation
#   dotfiles, exec, repeat            none    $HOME
#
# The two `sudo = true` lines in the flatpak sections below are the exception:
# the playbook asks for system-wide installs there, so this does too.

# ---- repositories -----------------------------------------------------------

[sources.copr]
parallel = 1
atim/starship

[sources.rpm]
parallel = 1
# `terra` and `vscode` are known to the tool: it writes the .repo file and
# imports the GPG key. `code` is an alias for `vscode`.
terra
vscode

# The playbook reaches Terra through `dnf install --repofrompath`, which needs
# no key at all because it is a one-shot install of terra-release. Declaring it
# as a repository instead means it is configured once and stays verifiable, so
# the URL and key are explicit:
#[sources.rpm.terra]
#baseurl = https://terra.fury.org/terra/$release/$basearch
#gpgkey  = https://terra.fury.org/terra/terra-keyring

[sources.flatpak]
parallel = 1
flathub
# The playbook uses `become: true` for the remote, i.e. a system-wide remote.
sudo = true

# ---- packages ---------------------------------------------------------------
#
# `install_weak_deps: false` in the playbook has no equivalent here: dnf does
# not pull weak dependencies by default.

[packages.dnf]
parallel = 2
# CLI
stow
tmux
git
fish
bat
jq
wget
unzip
zip
starship
chromium
podman-compose
# Rust + editors (all dnf, no rustup)
rustc
cargo
rustfmt
rust-clippy
rust-analyzer
rust-src
bacon           # Terra
helix
wayland
noctalia
espanso-wayland # Terra
# VS Code, from [sources.rpm.vscode]
code

[installer.bun]
binary = bun
# bun is installed by its own script, not by any package manager, so this check
# is the same guard the playbook used in `creates:`.
check = test -x ${home}/.bun/bin/bun
install = ${home}/.bun/bin/bun add -g ${packages}
# Not a package-manager index: bun resolves its own downloads, so there is no
# [sources.*] to wait for.
needs_sources = false
# `after =` is the missing half of the builtin. Nothing in the graph knows that
# bun has to exist before `bun install -g` can work, so without this line
# opencode-ai races [exec.bun] inside lane 3.
after = exec.bun

[packages.bun]
parallel = 3
opencode-ai

[packages.flatpak]
parallel = 3
# `method: system` in the playbook: machine-wide, so root, so `sudo = true`.
# Drop that line for a per-user install instead.
sudo = true
com.github.tchx84.Flatseal   # manage flatpak permissions
org.kde.kdenlive             # video editing
org.inkscape.Inkscape        # vector manipulation
com.valvesoftware.Steam
org.onlyoffice.desktopeditors
com.obsproject.Studio        # screen/stream recording
io.github.mfat.sshpilot      # SSH connection manager

# ---- config and tools -------------------------------------------------------

[dotfiles]
parallel = 3
repo = ${config_repo}
# The playbook clones to ~/repos/myconfig and stows from there. bootstrapper
# uses its own location instead; see README.md if you want them to match.
branch = main
stow =
config

# `adopt` is deliberately not set. Your machine already has real ~/.tmux.conf,
# ~/.config/starship.toml and ~/.config/fish/config.fish — not stow links — and
# stow refuses to replace a real file with a symlink. Without the backup they
# would fail here; with it each one becomes `<name>.bk` and the symlink goes in
# beside it. An earlier `.bk` is never overwritten, so run this twice and you
# still have both versions.
#
# If you are running this on a machine where the Ansible playbook has already
# stowed those files, remove its git and stow tasks first: two systems managing
# the same paths will fight.

# Installers are `curl | sh`, so each one is guarded by a `check` that is the
# same condition the playbook used in `creates:`. Without a check the
# operation would be "run it every time", and bootstrapper says so in the output
# rather than pretending to be idempotent.

[exec.bun]
parallel = 3
check = test -x ${home}/.bun/bin/bun
run = curl -fsSL https://bun.sh/install | bash

[exec.uv]
parallel = 3
check = test -x ${home}/.local/bin/uv
run = curl -LsSf https://astral.sh/uv/install.sh | sh

[exec.lazydocker]
parallel = 3
check = test -x ${home}/.local/bin/lazydocker
run = curl -fsSL https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash

[exec.opencode]
parallel = 3
check = command -v opencode
run = ${home}/.bun/bin/bun install -g opencode-ai

[exec.opt-dir]
parallel = 3
# For AppImages dropped in by hand; LM Studio has no stable download URL.
check = test -d ${home}/opt
run = mkdir -p ${home}/opt

# espanso is installed by [packages.dnf]. To run it as a user service:
#
#   espanso service register
#   espanso start
#
# Not automated here because `service register` is not idempotent and re-running
# it fails; do it once.

# ==============================================================================