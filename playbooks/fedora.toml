# ==============================================================================
# Fedora KDE — the bootstrap.toml for playbooks/fedora_new.yml
# ==============================================================================
#
#   minimal_bootstrapper list  -c playbooks/fedora.toml
#   minimal_bootstrapper check -c playbooks/fedora.toml   # read-only report
#   minimal_bootstrapper apply -c playbooks/fedora.toml --sudo
#   minimal_bootstrapper apply -c playbooks/fedora.toml --only dnf --sudo
#
# Run it as yourself, never as `sudo minimal_bootstrapper`. Under root, $HOME is
# /root, so `bun install -g` and `uv tool install` put your tools somewhere your
# PATH never looks. `--sudo` asks for your password once, up front, then
# escalates only the commands that need it.
#
# The whole idea: everything below is a *check* and a *fix*. Apply is the
# difference between the two, which is why it is safe to run twice.
#
# How the Ansible playbook maps onto this file:
#
#   playbook task                     here
#   ------------------------------    --------------------------------------
#   dnf copr enable atim/starship     [exec.copr]
#   Terra repo                        [repos.terra]
#   VS Code key + repo + install      [repos.vscode] + [packages.dnf]
#   package: name: [...]              [packages.dnf]
#   git clone + stow                  [dotfiles]
#   curl | bash installers            [exec.*], guarded by a `check`
#   bun install -g opencode-ai        [packages.bun]
#   flatpak_remote flathub            [exec.flathub]
#   flatpak method: system            [installer.flatpak] with sudo = true
#
# `install_weak_deps: false` in the playbook has no equivalent: dnf does not
# pull weak dependencies by default.

# ---- variables --------------------------------------------------------------
#
# `${name}` expands anywhere outside an installer's own commands, including in
# URLs. Variables may reference each other in any order. A whole `$NAME` on its
# own reads the environment, so `$release` and `$basearch` — which belong to
# dnf, not to us — reach the repositories untouched.

[variables]
config_repo = "https://github.com/mehdi-yc/postinstall"
terra_base = "https://terra.fury.org/terra"

# ---- privilege, for reference -----------------------------------------------
#
# Each section may set `sudo`; where it is absent the default for that kind
# applies:
#
#   [repos.*]                        root    /etc/yum.repos.d, /etc/pki
#   [installer.dnf]                  root    the rpmdb
#   [installer.cargo|uv|bun|flatpak] none    $HOME
#
# The `sudo = true` on the flatpak installer is the exception: the playbook asks
# for system-wide installs there, so this does too. Delete that line for a
# per-user install instead.

# ---- repositories -----------------------------------------------------------

# Terra, declared properly: the .repo file is written and the key imported, so
# the configuration is verifiable afterwards. The playbook reaches Terra through
# `dnf install --repofrompath`, which needs no key because it is a one-shot
# install of terra-release.
[repos.terra]
parallel = 1
url = "${terra_base}/$release/$basearch"
key = "${terra_base}/terra-keyring"

[repos.vscode]
parallel = 1
url = "https://packages.microsoft.com/yumrepos/vscode"
key = "https://packages.microsoft.com/keys/microsoft.asc"
name = "code"

# ---- package managers -------------------------------------------------------
#
# An installer is two shell commands: `check` for one package, `install` for
# everything missing at once. `{package}` and `{packages}` are this file's own
# placeholders — deliberately a different sigil from `${...}`, so the two can
# never be confused.

[installer.dnf]
check = "rpm -q {package}"
install = "dnf install -y {packages}"
sudo = true
# dnf and `rpm --import` both take the rpmdb lock, so nothing else may hold it
# at the same time.
resource = "rpm"

[installer.cargo]
check = "cargo install --list | grep -q '^{package} v'"
install = "cargo install {packages}"
path = ["$HOME/.cargo/bin"]

[installer.uv]
check = "uv tool list | grep -q '^{package} '"
install = "uv tool install {packages}"
path = ["$HOME/.local/bin"]

[installer.bun]
check = "$HOME/.bun/bin/bun pm ls -g | grep -q ' {package}@'"
install = "$HOME/.bun/bin/bun add -g {packages}"
path = ["$HOME/.bun/bin"]

# The playbook installs flatpaks with `method: system`: machine-wide, so root.
[installer.flatpak]
check = "flatpak info {package}"
install = "flatpak install -y --system {packages}"
sudo = true

# ---- packages ---------------------------------------------------------------

[packages.dnf]
parallel = 2
names = [
    # CLI
    "stow", "tmux", "git", "fish", "bat", "jq", "wget", "unzip", "zip",
    "starship", "chromium", "podman-compose",
    # Rust and editors, all from dnf rather than rustup
    "rustc", "cargo", "rustfmt", "rust-clippy", "rust-analyzer", "rust-src",
    # Terra
    "bacon", "wayland", "noctalia", "espanso-wayland",
    # from [repos.vscode]
    "code",
]

[packages.flatpak]
parallel = 3
after = ["exec.flathub"]
names = [
    "com.github.tchx84.Flatseal",  # manage flatpak permissions
    "org.kde.kdenlive",            # video editing
    "org.inkscape.Inkscape",       # vector manipulation
    "com.valvesoftware.Steam",
    "org.onlyoffice.desktopeditors",
    "com.obsproject.Studio",       # screen and stream recording
    "io.github.mfat.sshpilot",     # SSH connection manager
]

# `after` is not decoration. Nothing in the graph knows that `bun` has to exist
# before `bun add -g` can work, so without this line opencode-ai races
# [exec.bun] inside lane 3.
[packages.bun]
parallel = 3
after = ["exec.bun"]
names = ["opencode-ai"]

[packages.cargo]
parallel = 3
after = ["packages.dnf"]
names = ["bacon"]

[packages.uv]
parallel = 3
names = ["ruff", "pre-commit"]

# ---- dotfiles ---------------------------------------------------------------

[dotfiles]
parallel = 3
repo = "${config_repo}"
branch = "main"
stow = ["config"]

# An existing file is moved to `<name>.bk` before stow links over it, and an
# earlier backup is never overwritten — so run this twice and you still have
# both versions. Your machine already has a real ~/.tmux.conf,
# ~/.config/starship.toml and ~/.config/fish/config.fish, and stow refuses to
# replace a real file with a symlink.
#
# If the Ansible playbook has already stowed those files on this machine,
# remove its git and stow tasks first: two systems managing the same paths will
# fight.

# ---- one-shot installers ----------------------------------------------------
#
# `curl | sh` needs a guard or it runs on every apply. Each `check` below is the
# same condition the playbook used in `creates:`. Without one, the operation
# reports itself as running every time rather than pretending to be idempotent.

[exec.copr]
parallel = 1
check = "dnf repolist --enabled | grep -q atim/starship"
run = "dnf install -y 'dnf-command(copr)' && dnf copr enable -y atim/starship"

[exec.flathub]
parallel = 2
sudo = true
run = "flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo"

[exec.bun]
parallel = 3
check = "test -x $HOME/.bun/bin/bun"
run = "curl -fsSL https://bun.sh/install | bash"

[exec.uv]
parallel = 3
check = "test -x $HOME/.local/bin/uv"
run = "curl -LsSf https://astral.sh/uv/install.sh | sh"

[exec.lazydocker]
parallel = 3
check = "test -x $HOME/.local/bin/lazydocker"
run = "curl -fsSL https://raw.githubusercontent.com/jesseduffield/lazydocker/master/scripts/install_update_linux.sh | bash"

[exec.opencode]
parallel = 3
check = "command -v opencode"
run = "$HOME/.bun/bin/bun install -g opencode-ai"

# For AppImages dropped in by hand; LM Studio has no stable download URL.
[exec.opt]
parallel = 3
check = "test -d $HOME/opt"
run = "mkdir -p $HOME/opt"

# espanso is installed by [packages.dnf]. To run it as a user service:
#
#   espanso service register
#   espanso start
#
# Not automated here because `service register` is not idempotent and re-running
# it fails. Do it once.