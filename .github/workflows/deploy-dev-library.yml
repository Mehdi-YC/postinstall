name: Deploy dev library to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/tech-reference-zola/**"
  workflow_dispatch:

# Only the latest deploy should run; older ones are cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        # Pinned: Zola config format and behaviour change between minor
        # versions (0.23 templating content, 0.20 renamed config.toml).
        run: |
          curl -sL -o zola.tar.gz \
            https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz
          tar xzf zola.tar.gz
          sudo mv zola /usr/local/bin/zola
          zola --version

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: zola build --minify
        working-directory: docs/tech-reference-zola

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/tech-reference-zola/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4