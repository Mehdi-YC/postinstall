# The URL the site will be built for.
# Served at the domain root by nginx. Every internal link, canonical tag and
# sitemap URL is derived from this value — changing it means rebuilding.
base_url = "https://tutos.mehdi-yc.com"
title = "Developer Reference Library"
description = "Rust, Python, Odoo, Django, PostgreSQL, Networking, and DevOps reference guides"
default_language = "en"
# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Several books document Jinja/Django/JS syntax ({{ ... }}) in fenced code
# blocks. Zola >= 0.20 treats content files as Tera templates and would try to
# execute them, so content templating is disabled site-wide.
skip_content_templating = ["**/*.md"]



# Taxonomies (tags and categories)
taxonomies = [{ name = "tags", paginate_by = 10 }, { name = "categories" }]

# Content structure
# generate_feed = true
# feed_filename = "atom.xml"


[markdown]
insert_anchor_links = "left"
render_emoji = false

[markdown.highlighting]
theme = "github-dark"


# Extra data for templates
[extra]
author = "Mehdi YAHIA CHERIF"
repo_url = "https://github.com/mehdi-yc/postinstall"
